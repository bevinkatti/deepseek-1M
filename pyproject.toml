[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "deepseek-1m"
version = "1.0.0"
description = "Unlock DeepSeek-V4's 1M context window — chat with entire codebases, books, and email archives"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "deepseek-1M contributors" }]
keywords = [
    "deepseek", "llm", "ai", "context-window", "1m-tokens",
    "codebase-chat", "document-analysis", "rag-free"
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "openai>=1.30.0",
    "rich>=13.7.0",
    "tiktoken>=0.7.0",
]

[project.optional-dependencies]
pdf = ["pypdf>=4.0.0"]
web = ["beautifulsoup4>=4.12.0"]
demo = ["streamlit>=1.35.0"]
all = [
    "pypdf>=4.0.0",
    "beautifulsoup4>=4.12.0",
    "streamlit>=1.35.0",
]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
]

[project.urls]
Homepage = "https://github.com/bevinkatti/deepseek-1M"
Documentation = "https://github.com/bevinkatti/deepseek-1M#readme"
Repository = "https://github.com/bevinkatti/deepseek-1M"
"Bug Tracker" = "https://github.com/bevinkatti/deepseek-1M/issues"

[project.scripts]
deepseek-1m = "deepseek_1m.__main__:main"

[tool.setuptools.packages.find]
include = ["deepseek_1m*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.10"
strict = false
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
